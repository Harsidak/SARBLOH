# E021 — configuration. The hash of this file goes in the ledger.
# Overrides on top of Sarbloh-Experimentation/prime/config.py DEFAULT (E008). Arm A = the same with
# goal_versioning: false.
experiment: E021_versioned_goal
baseline: E008_perception_memory      # same code, switch off

code: Sarbloh-Experimentation/prime
games: [ls20]                         # owner decision 2026-10-01: local only, ls20 only

agent:
  toolset: e008
  memory:
    goal_versioning: true             # the switch under test
    goal_lock_after_level: 1          # amendment 1 (owner): goal locked once level 1 is won; 0 = never
    goal_history_shown: 5             # amendment 1: last 5 goal changes, with reasons, in the goal block
    caps:
      goal_versioned: 400             # goal block cap with the switch on (E008: goal 150; first run: 250)

local:
  model: Qwen3.5-4B Q4_K_M + mmproj (llama.cpp, scripts/serve_llm.ps1 -Vision)
  ctx: 16384
  command: >-
    uv run python Sarbloh-Experimentation/prime/run.py --games ls20 --max-actions 30 --minutes 12 --vision
    --ctx 16384 --goal-versioning --experiment E021_versioned_goal --out runs/experimentation_local/E021_ls20

kaggle:                               # not run (owner's call); notebook EXPERIMENT_OVERRIDES would be:
  EXPERIMENT: E021_versioned_goal
  EXPERIMENT_OVERRIDES: {agent: {memory: {goal_versioning: true}}}
