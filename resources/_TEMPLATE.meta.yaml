# Copy beside every artefact. Name it <artefact-filename>.meta.yaml
source_url:          # exact URL, or "local" / "generated"
retrieved:           # YYYY-MM-DD
kind:                # paper | blog | repo | official | leaderboard | dataset
title:
authors:             # optional
why:                 # one line: what this is here to answer
relates_to:          # experiment ids or module names, optional
licence:             # required for anything under repos/
verified:            # true if a human checked the extraction is faithful
