[project]
name = "sarbloh"
version = "0.1.0"
description = "Verified-only memory architecture for interactive reasoning agents (ARC-AGI-3)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Harsidak Singh Banwait" }]

dependencies = [
  "arc-agi>=0.9.9",
  "numpy",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sarbloh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=300"

[tool.ruff]
line-length = 110
target-version = "py312"
