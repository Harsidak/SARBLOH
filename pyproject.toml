[project]
name = "sarbloh"
version = "0.1.0"
description = "Verified-only memory architecture for interactive reasoning agents (ARC-AGI-3)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Harsidak Singh Banwait" }]

dependencies = [
  "arc-agi>=0.9.9",
  "numpy",
  "pyyaml",
]

# Local environment: `uv sync` installs the default groups; `uv sync --group train` adds the GPU training stack.
# Kaggle does not use this file — notebooks pin their own deps (Python 3.12, arc-agi 0.9.9, vLLM).
[dependency-groups]
dev = ["pytest", "pytest-timeout", "ruff"]
notebook = ["ipykernel", "jupyterlab", "matplotlib", "pandas", "tqdm"]
# Client side of the LLM loop. Local server is llama.cpp (tools/llama.cpp), Kaggle server is vLLM; both speak the
# OpenAI API, so harness code is identical and only the base URL changes.
llm = ["openai", "huggingface_hub[hf_xet]", "pillow"]
# LoRA SFT (the default training route, CLAUDE.md §0). Opt-in: large download, CUDA wheels.
train = ["torch", "transformers", "peft", "accelerate", "datasets", "bitsandbytes"]

[tool.uv]
default-groups = ["dev", "notebook", "llm"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sarbloh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=300"

[tool.ruff]
line-length = 110
target-version = "py312"
